# Configuration Netlify (utilisée à la mise en ligne, étape 7).
# Si le dépôt contient le dossier site/ à sa racine, indiquer « site » comme dossier de base dans Netlify.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fonctions serveur (invitation à l'espace client) : netlify/functions
[functions]
  node_bundler = "esbuild"

# Back-office : jamais indexé, jamais affiché dans un cadre, service worker toujours à jour.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/espace-client"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Cache-Control = "no-cache"

# Formules renommées le 24/11/2026 : Libération → Clés en main, Transition → Nouveau départ.
# Netlify applique ces règles avec ou sans barre finale. Anciennes fiches PDF redirigées vers les nouvelles.
[[redirects]]
  from = "/liberation"
  to = "/cles-en-main"
  status = 301

[[redirects]]
  from = "/liberation.html"
  to = "/cles-en-main"
  status = 301

[[redirects]]
  from = "/transition"
  to = "/nouveau-depart"
  status = 301

[[redirects]]
  from = "/transition.html"
  to = "/nouveau-depart"
  status = 301

[[redirects]]
  from = "/docs/Fiche-Liberation.pdf"
  to = "/docs/Fiche-Cles-en-main.pdf"
  status = 301

[[redirects]]
  from = "/docs/Fiche-Liberation-notaires.pdf"
  to = "/docs/Fiche-Cles-en-main-notaires.pdf"
  status = 301

[[redirects]]
  from = "/docs/Fiche-Liberation-agences.pdf"
  to = "/docs/Fiche-Cles-en-main-agences.pdf"
  status = 301

[[redirects]]
  from = "/docs/Fiche-Transition.pdf"
  to = "/docs/Fiche-Nouveau-depart.pdf"
  status = 301

[[redirects]]
  from = "/docs/Fiche-Transition-notaires.pdf"
  to = "/docs/Fiche-Nouveau-depart-notaires.pdf"
  status = 301

[[redirects]]
  from = "/docs/Fiche-Transition-agences.pdf"
  to = "/docs/Fiche-Nouveau-depart-agences.pdf"
  status = 301
