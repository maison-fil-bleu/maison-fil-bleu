<div style="font-family:Georgia,'Times New Roman',serif;color:#18202C;max-width:520px;margin:0 auto;padding:24px">
  <p style="font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#3D5A80;margin:0 0 18px">Maison Fil Bleu</p>
  <h1 style="font-weight:500;font-size:26px;margin:0 0 16px">Votre code de connexion</h1>
  <p style="font-family:Arial,sans-serif;font-size:15px;line-height:1.6;color:#4A4F58">Saisissez ce code sur la page de connexion :</p>
  <p style="font-family:Arial,sans-serif;font-size:32px;letter-spacing:8px;font-weight:bold;color:#15233A;background:#EFE9DE;padding:16px 20px;text-align:center;margin:8px 0 20px">{{ .Token }}</p>
  <p style="font-family:Arial,sans-serif;font-size:15px;line-height:1.6;color:#4A4F58">Ou, depuis cet appareil, <a href="{{ .ConfirmationURL }}" style="color:#3D5A80">cliquez ici pour vous connecter</a>.</p>
  <p style="font-family:Arial,sans-serif;font-size:13px;line-height:1.6;color:#6B7079">Ce code est valable une heure. Si vous n'avez rien demandé, ignorez simplement cet e-mail.</p>
</div>
